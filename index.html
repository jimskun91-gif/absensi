<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1730">
  <title>Pemindai QR Absensi Guru</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#152238;background:#f1f5f9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center}
    main{width:min(100%,520px);background:#fff;border:1px solid #dbe4f0;border-radius:20px;padding:clamp(18px,5vw,30px);box-shadow:0 18px 48px #0f172a18}
    .tag{display:inline-flex;padding:5px 10px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:12px 0 7px;font-size:clamp(22px,6vw,30px)}p{line-height:1.55;color:#526179;font-size:14px;margin:8px 0}
    .notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;margin:14px 0}
    .notice.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}.notice.ok{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    button{min-height:46px;border:0;border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:750;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.primary{background:#1d4ed8;color:#fff;flex:1}.secondary{background:#e2e8f0;color:#1e293b}
    #reader{width:100%;overflow:hidden;border-radius:14px;background:#0f172a;margin-top:14px;min-height:200px}
    #reader video{border-radius:12px}
    .small{font-size:12px;color:#718096}.hidden{display:none!important}
  </style>
</head>
<body>
  <main>
    <span class="tag">Pemindai absensi</span>
    <h1>Scan QR Absensi</h1>
    <p>Arahkan kamera ke QR absensi. Setelah terbaca, absensi dikirim otomatis ke sistem sekolah.</p>
    <div id="status" class="notice" role="status">Menyiapkan kamera…</div>
    <div id="reader" class="hidden"></div>
    <div class="actions">
      <button id="startButton" class="primary hidden" type="button" onclick="mulaiKamera()">📷 Mulai kamera</button>
      <button id="closeButton" class="secondary" type="button" onclick="tutupHalaman()">Tutup</button>
    </div>
    <p class="small">Izin kamera diminta untuk situs ini: <b id="siteHost"></b></p>
  </main>
<script>
'use strict';
window.onerror=function(msg,src,line){tampil('Skrip pemindai gagal: '+msg+' (baris '+line+').','error')};

var params=new URLSearchParams(window.location.search);
var ticket=(params.get('ticket')||'').toLowerCase();
var returnUrl=params.get('returnUrl')||'';
var scanner=null,libraryPromise=null,selesai=false;
var statusBox=document.getElementById('status'),reader=document.getElementById('reader'),startButton=document.getElementById('startButton');
document.getElementById('siteHost').textContent=window.location.hostname;

function returnUrlValid(){
  try{
    var u=new URL(returnUrl),h=u.hostname.toLowerCase();
    return u.protocol==='https:'&&(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.script.googleusercontent.com'));
  }catch(e){return false}
}
function tampil(teks,jenis){
  statusBox.textContent=teks;statusBox.className='notice'+(jenis==='error'?' error':(jenis==='ok'?' ok':''));
}
function pesanKamera(e){
  var name=String(e&&e.name||''),message=String(e&&e.message||e||''),all=(name+' '+message).toLowerCase();
  if(window.isSecureContext===false)return 'Halaman pemindai harus dibuka melalui HTTPS.';
  if(/notallowed|permissiondenied|permission denied|not allowed|denied/.test(all))return 'Kamera ditolak untuk situs ini. Izinkan Kamera di ikon gembok/pengaturan situs Chrome, dan pastikan izin Kamera Chrome di Android aktif. Lalu tekan Mulai kamera.';
  if(/notfound|devicesnotfound|no camera|requested device/.test(all))return 'Kamera tidak ditemukan di perangkat ini.';
  if(/notreadable|trackstart|could not start|in use/.test(all))return 'Kamera sedang dipakai aplikasi atau tab lain. Tutup aplikasi kamera lain, lalu tekan Mulai kamera.';
  return 'Kamera gagal dibuka: '+(message||'kesalahan tidak diketahui')+'.';
}
// Library disimpan di folder vendor/ (lebih cepat, tidak bergantung CDN). Jika tidak ada, coba CDN.
function muatSkrip(src){
  return new Promise(function(resolve,reject){
    var script=document.createElement('script');script.async=true;script.src=src;
    script.onload=function(){typeof Html5Qrcode==='function'?resolve():reject(new Error('Library pemindai tidak tersedia.'))};
    script.onerror=function(){reject(new Error('gagal:'+src))};
    document.head.appendChild(script);
  });
}
function muatLibrary(){
  if(typeof Html5Qrcode==='function')return Promise.resolve();
  if(!libraryPromise){
    libraryPromise=muatSkrip('vendor/html5-qrcode.min.js')
      .catch(function(){return muatSkrip('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js')})
      .catch(function(e){libraryPromise=null;throw new Error('Library pemindai gagal dimuat. Periksa koneksi internet.')});
  }
  return libraryPromise;
}
async function hentikanKamera(){
  var current=scanner;scanner=null;
  if(current){try{await current.stop()}catch(e){}try{await current.clear()}catch(e){}}
  reader.classList.add('hidden');reader.innerHTML='';
}
async function mulaiKamera(){
  if(selesai)return;
  if(window.isSecureContext===false||!navigator.mediaDevices||typeof navigator.mediaDevices.getUserMedia!=='function'){
    tampil(pesanKamera(new Error('NotAllowedError: getUserMedia tidak tersedia.')),'error');return;
  }
  startButton.disabled=true;tampil('Meminta izin kamera…');
  try{
    await muatLibrary();
    var config={verbose:false};
    if(typeof Html5QrcodeSupportedFormats!=='undefined')config.formatsToSupport=[Html5QrcodeSupportedFormats.QR_CODE];
    reader.innerHTML='';reader.classList.remove('hidden');
    scanner=new Html5Qrcode('reader',config);
    var side=Math.min(270,Math.max(180,(window.innerWidth||390)-88));
    await scanner.start({facingMode:'environment'},{fps:8,qrbox:{width:side,height:side},aspectRatio:1},function(code){kodeTerbaca(code)},function(){});
    startButton.classList.add('hidden');tampil('Kamera aktif. Arahkan ke QR absensi.');
  }catch(e){
    await hentikanKamera();startButton.disabled=false;startButton.classList.remove('hidden');startButton.textContent='📷 Coba lagi';
    tampil(pesanKamera(e),'error');
  }finally{startButton.disabled=false}
}
// Hanya kode QR absensi resmi yang diteruskan; QR lain diabaikan dan pemindaian berlanjut.
function kodeTerbaca(code){
  if(selesai)return;
  var teks=String(code||'').trim();
  if(!/^SAGQR[12]:[A-Fa-f0-9]{20,64}$/.test(teks))return;
  if(!/^[a-f0-9]{32}$/.test(ticket)||!returnUrlValid()){
    tampil('Tautan pemindai tidak lengkap. Tutup tab ini dan tekan Pindai dari Portal Guru lagi.','error');return;
  }
  selesai=true;
  tampil('QR terbaca. Mengirim absensi ke sistem…','ok');
  hentikanKamera();
  var tujuan=new URL(returnUrl);
  tujuan.searchParams.set('scanTicket',ticket);
  tujuan.searchParams.set('scanCode',teks);
  window.location.href=tujuan.href;
}
function tutupHalaman(){
  hentikanKamera();
  try{window.close()}catch(e){}
  tampil('Anda dapat menutup tab ini dan kembali ke Portal Guru.','');
}
window.addEventListener('pagehide',function(){try{if(scanner&&scanner.isScanning)scanner.stop()}catch(e){}});

(function init(){
  if(!/^[a-f0-9]{32}$/.test(ticket)||!returnUrlValid()){
    tampil('Halaman ini harus dibuka dari tombol Pindai di Portal Guru.','error');startButton.classList.add('hidden');return;
  }
  mulaiKamera();
})();
</script>

</html>
